<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Stars Online</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
    <style>
        body { background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        canvas { border: 4px solid #facc15; background: #000; border-radius: 15px; margin-top: 10px; width: 300px; height: 300px; }
        .stats { margin-top: 10px; font-size: 18px; font-weight: bold; }
        .leaderboard { background: rgba(255,255,255,0.1); padding: 8px; border-radius: 10px; margin-top: 10px; width: 280px; font-size: 13px; color: #fbbf24; line-height: 1.4; }
        .controls { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; margin-top: 15px; }
        .btn { width: 70px; height: 70px; background: #334155; border: 2px solid #facc15; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; color: white; }
        .btn:active { background: #facc15; }
    </style>
</head>
<body>
    <div class="stats">⭐️ Звёзды: <span id="score">0</span></div>
    <canvas id="game" width="400" height="400"></canvas>
    <div id="leaderboard" class="leaderboard">Загрузка рекордов...</div>
    <div class="controls">
        <div></div><div class="btn" onclick="if(d!='down')d='up'">▲</div><div></div>
        <div class="btn" onclick="if(d!='right')d='left'">◀️</div><div class="btn" onclick="if(d!='up')d='down'">▼</div><div class="btn" onclick="if(d!='left')d='right'">▶️</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDSgifQ_yOv8eFEmJSAfe6rKexUzdn-0j0",
            authDomain: "snakegame-84c2a.firebaseapp.com",
            projectId: "snakegame-84c2a",
            storageBucket: "snakegame-84c2a.firebasestorage.app",
            messagingSenderId: "291210085927",
            appId: "1:291210085927:web:599a96445f5edcf0353002",
            measurementId: "G-L46BJ8WRZC"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const tg = window.Telegram.WebApp;
        const name = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "Игрок";
        tg.expand();

        const c=document.getElementById("game"), ctx=c.getContext("2d");
        let b=20, s=0, sn=[{x:200,y:200}], f={x:100,y:100}, d="right";

        function draw() {
            ctx.fillStyle="black"; ctx.fillRect(0,0,400,400);
            sn.forEach((p,i)=>{ ctx.fillStyle=i==0?"#facc15":"#854d0e"; ctx.fillRect(p.x,p.y,b,b); });
            ctx.font = "24px serif"; ctx.fillText("⭐️", f.x-2, f.y+18);

            let hX=sn[0].x, hY=sn[0].y;
            if(d=="up") hY-=b; if(d=="down") hY+=b; if(d=="left") hX-=b; if(d=="right") hX+=b;

            if(hX==f.x && hY==f.y){
                s++; document.getElementById("score").innerText=s;
                f={x:Math.floor(Math.random()*19)*b, y:Math.floor(Math.random()*19)*b};
            } else sn.pop();

            let n={x:hX,y:hY};
            if(hX<0||hX>=400||hY<0||hY>=400||sn.some(p=>p.x==hX&&p.y==hY)){
                saveScore(name, s);
                alert("Игра окончена! ⭐️: " + s);
                location.reload();
            }
            sn.unshift(n);
        }

        async function saveScore(n, score) {
            if(score > 0) {
                await db.collection("top").add({ name: n, score: score, date: new Date() });
            }
        }

        function getTop() {
            db.collection("top").orderBy("score", "desc").limit(5).onSnapshot(s => {
                let h = "🏆 ТОП-5 ОНЛАЙН:<br>";
                s.forEach(doc => h += `${doc.data().name}: ${doc.data().score} ⭐️<br>`);
                document.getElementById("leaderboard").innerHTML = h;
            });
        }

        getTop();
        setInterval(draw, 140);
    </script>
</body>
</html>
